name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall scripts/

      - name: Smoke test – triage classifier (dry-run)
        run: |
          python scripts/triage_classifier.py --mode incident --description "CI smoke test" --dry-run
          python scripts/triage_classifier.py --mode change --description "CI smoke test" --dry-run
          python scripts/triage_classifier.py --mode service_request --description "CI smoke test" --dry-run

      - name: Smoke test – incident handler (list)
        run: python scripts/incident_handler.py --action list
